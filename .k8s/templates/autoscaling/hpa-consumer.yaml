{{- $root := . }}
{{- range $name, $consumer := .Values.consumers }}
{{- $autoscaling := $consumer.autoscaling | default dict }}
{{- if and $consumer.enabled $autoscaling.enabled }}
{{- $ctx := dict "root" $root "name" $name "consumer" $consumer }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "slim4-app.consumerFullname" $ctx }}
  labels:
    {{- include "slim4-app.consumerLabels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "slim4-app.consumerFullname" $ctx }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
